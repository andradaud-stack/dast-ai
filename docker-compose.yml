services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY}
      -config api.addrs.addr.name=orchestrator
      -config api.addrs.addr.regex=false
    networks: [dast]
    # tidak ada "ports:" -> API ZAP tidak terbuka ke host

  orchestrator:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [zap]
    networks: [dast]
    extra_hosts: ["host.docker.internal:host-gateway"]

networks:
  dast:
    internal: false   # ubah ke true + proxy egress jika ingin isolasi ketat
